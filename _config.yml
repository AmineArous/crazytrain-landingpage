# Feature List
features                                  :

  - title                                 : Five Handcrafted Scenes
    description                           : The caboose, the game car, the dining car, the mail car and the locomotive, in the Sierra Nevada of 1886.
    fontawesome_icon_name                 : train

  - title                                 : A Runaway Train
    description                           : No one at the controls, a storm overhead and a broken bridge ahead. Stop the train before it's too late.
    fontawesome_icon_name                 : bolt

  - title                                 : Puzzles Hidden in Every Object
    description                           : Soot-covered windows, a game of chess, a wine cellar, stamps under a magnifying glass, wires in the dark and steam valves.
    fontawesome_icon_name                 : puzzle-piece

  - title                                 : A New Game Each Time
    description                           : The caboose number, the chess game, the dining car password and the pipes are drawn anew for every game.
    fontawesome_icon_name                 : dice

  - title                                 : One Hint at a Time
    description                           : A hint matched to where you are in the scene. Never the answer.
    fontawesome_icon_name                 : lightbulb

  - title                                 : First Scene Free
    description                           : Unlock the other four with a single purchase. English and French, no account, no ads.
    fontawesome_icon_name                 : unlock



